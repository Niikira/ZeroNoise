[project]
name = "zeronoise"
version = "0.1.0"
description = "Mark silent stretches in a video as a DaVinci Resolve timeline."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Niikira" }]
dependencies = []

[project.scripts]
zeronoise = "zeronoise.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]